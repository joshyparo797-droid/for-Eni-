<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Eni 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Lora:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--sky1:#0b1033;--sky2:#2a1f52;--rose:#f3b8c8;--gold:#f6d68a;--paper:#fbf6ee;--ink:#2e2540;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 120%,#5b3a7a 0,var(--sky2) 40%,var(--sky1) 100%);color:#fff;font-family:'Lora',Georgia,serif;overflow:hidden}
canvas{z-index:5;position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;transition:opacity .9s}
.hidden{opacity:0;pointer-events:none}
.hint{margin-top:34px;font-style:italic;color:var(--rose);animation:pulse 2.4s infinite}
@keyframes pulse{50%{opacity:.4}}
/* envelope */
.env{position:relative;width:min(78vw,340px);aspect-ratio:1.5;cursor:pointer;background:none;border:0;padding:0;transition:transform .35s cubic-bezier(.3,1.6,.5,1),filter .35s;filter:drop-shadow(0 18px 30px #0008);animation:float 4s ease-in-out infinite}
.env:hover,.env:focus-visible{transform:translateY(-10px) rotate(-2deg) scale(1.05);filter:drop-shadow(0 0 28px #f3b8c8aa) drop-shadow(0 18px 30px #0008);outline:none}
@keyframes float{50%{translate:0 -6px}}
.env .body{position:absolute;inset:0;background:linear-gradient(135deg,#f7dfe5,#f0c6d3);border-radius:8px}
.env .flap{position:absolute;left:0;right:0;top:0;height:58%;background:linear-gradient(#f9e6ea,#eab3c4);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s .1s,z-index 0s .4s;z-index:3;border-radius:8px 8px 0 0}
.env .front{position:absolute;inset:0;z-index:2;background:linear-gradient(to top right,#f2c9d5 49.5%,transparent 50%) left/50% 100% no-repeat,linear-gradient(to top left,#f4d3dc 49.5%,transparent 50%) right/50% 100% no-repeat;border-radius:8px}
.env .seal{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9fb5,#c2395d);z-index:4;display:grid;place-items:center;font-size:20px;box-shadow:0 3px 8px #0006;transition:opacity .3s}
.env .card{position:absolute;left:8%;right:8%;top:8%;bottom:8%;background:var(--paper);border-radius:4px;z-index:1;transition:transform .9s .5s}
.env.open{animation:none;pointer-events:none}
.env.open .flap{transform:rotateX(180deg);z-index:0}
.env.open .seal{opacity:0}
.env.open .card{transform:translateY(-70%)}
/* greeting */
.hb{font-family:'Pinyon Script',cursive;font-size:clamp(3rem,15vw,7rem);line-height:1.1;color:var(--gold);text-shadow:0 0 24px #f6d68a88;margin:0}
.hb span{display:inline-block;opacity:0;animation:shoot .9s forwards cubic-bezier(.2,.8,.2,1)}
@keyframes shoot{from{opacity:0;transform:translate(220px,-160px) scale(.3) rotate(25deg);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.btn{margin-top:36px;padding:14px 30px;border-radius:40px;border:1px solid var(--gold);background:#f6d68a1a;color:var(--gold);font:italic 1.1rem 'Lora',serif;cursor:pointer;opacity:0;transition:background .3s,transform .3s}
.btn.show{opacity:1;transition:opacity 1.2s}
.btn:hover,.btn:focus-visible{background:#f6d68a40;transform:scale(1.05);outline:none}
/* letter */
#letter{position:fixed;inset:0;overflow-y:auto;padding:24px 14px 80px;opacity:0;pointer-events:none;transition:opacity 1s;-webkit-overflow-scrolling:touch}
#letter.show{opacity:1;pointer-events:auto}
.paper{max-width:640px;margin:0 auto;background:var(--paper);color:var(--ink);border-radius:6px;padding:40px 26px 48px;box-shadow:0 20px 60px #0009;transform:translateY(40px);transition:transform 1.2s}
#letter.show .paper{transform:none}
.paper h1{font-family:'Pinyon Script',cursive;font-weight:400;font-size:clamp(2.4rem,10vw,3.6rem);margin:0 0 24px;color:#b23a62;text-align:center}
.paper p{font-size:1.06rem;line-height:1.8;margin:0 0 1.1em}
.paper p.q{font-style:italic;padding-left:14px;border-left:3px solid var(--rose)}
.paper p.s{text-align:right;font-style:italic;margin-top:2em}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--rose),var(--gold));z-index:6}
.paper p{opacity:0;transform:translateY(14px);transition:opacity .9s,transform .9s}.paper p.in{opacity:1;transform:none}
.paper p.sub{text-align:center;font-style:italic;color:#7a5c8a;margin-bottom:2em}
.paper .party{display:block;margin:30px auto 0;color:#b23a62;border-color:#b23a62;background:#b23a6210}
@media(prefers-reduced-motion:reduce){.env,.hint{animation:none}.hb span{animation-duration:.01s}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="stage" id="s1">
  <button class="env" id="env" aria-label="Open the envelope">
    <div class="body"></div><div class="card"></div><div class="front"></div><div class="flap"></div><div class="seal">💌</div>
  </button>
  <div class="hint">Something is waiting for you, Eni. Tap the envelope.</div>
</div>

<div class="stage hidden" id="s2">
  <h1 class="hb" id="hb"></h1>
  <button class="btn" id="read">Read your letter</button>
</div>

<div id="bar"></div><div id="letter"><div class="paper"><h1>Happy Birthday, Eni.</h1><div id="txt"></div></div></div>

<script>
const T=`~A letter for someone I am genuinely glad I met.
Dear Eni,
Happy birthday!
I have been thinking about what to write to you today, and honestly, I don’t think a simple birthday wish would quite express everything I want to say.
You know, I initially planned to give you that first journal on your birthday. I had imagined it being something you would wake up to, something you could read and perhaps understand a little more about how I experienced our friendship and how much your presence has come to mean to me.
But then I sent it earlier than I had planned.
And somehow, I found myself wanting to write something else. Not necessarily another account of how we met or how our conversations began, but something that speaks more about you, about what I appreciate, and about what I genuinely hope for as we continue getting to know each other.
So perhaps this is the letter I was supposed to write today.
First, I want you to know that I am genuinely happy you exist. And I don’t mean that as one of those birthday expressions people casually throw around. I mean it in the simplest and most sincere way possible.
There is something beautiful about knowing that somewhere in this world, a person is living their own little story, experiencing life, having thoughts, making decisions, discovering things, and becoming someone. And somehow, our paths crossed.
I am glad yours crossed mine.
I hope today reminds you of how special your existence is, not just to the people who know you physically, but to the people whose lives you have touched in ways you might not even realise.
I hope you have a beautiful day. I hope you laugh without holding back, receive thoughtful messages, feel appreciated, and experience the kind of happiness that stays with you even after your birthday has passed.
But beyond today, I hope this new year of your life gives you so much more.
I hope you grow into someone you are proud of. I hope you discover opportunities that make you excited about the future. I hope you experience things that challenge you, teach you, and introduce you to new dimensions of yourself.
And I hope you never become so occupied with becoming someone that you forget to enjoy being yourself along the way.
There is no particular timeline you must follow. You don’t have to have everything figured out. You don’t have to be perfect. You are allowed to learn, make mistakes, change your mind, and begin again.
I hope you give yourself permission to experience life without constantly feeling like you have to get everything right.
And now, there’s something else I want to talk about.
I realised today that, despite how much I have come to appreciate you, I actually don’t know you as deeply as I would love to.
And I find that thought rather interesting.
I know certain things about you. I know some of your interests, some of your opinions, some of the things you enjoy, and perhaps a few things that make you who you are.
But there is still so much I haven’t discovered.
There are probably stories from your childhood that I have never heard. Experiences that shaped the way you think. Things that make you genuinely happy. Things that upset you more than you let people know. Little habits, unusual preferences, fears, ambitions, memories, and even those random things about yourself that you might consider insignificant.
I want to know those things.
I want to know what makes you laugh when nobody is trying to be funny. I want to know what you think about when you’re alone. I want to understand the things you are passionate about and the things you could talk about for hours without getting tired.
I want to know what makes you uncomfortable, what makes you feel understood, what you find difficult to express, and what you wish people understood about you without you having to explain it.
I want to know the things you are proud of and even the things you aren’t particularly proud of.
I want to know about the experiences that made you who you are today, the decisions you sometimes question, the lessons you learnt the hard way, and the dreams you haven’t told many people about.
I want to know your perspectives on life, love, friendship, family, society, happiness, and all those complicated things we sometimes find ourselves discussing.
And I don’t mean this as though I am trying to conduct an interview or collect information about you.
I simply want to know you.
Not just the version of you that appears during our everyday conversations, but the person behind all of that.
The person with an entire world of thoughts, memories, emotions, and experiences that I am yet to discover.
And perhaps the most beautiful part is that I want you to know me, too.
I don’t want our friendship to remain limited to the usual exchanges of how our days went, what happened, what we watched, or what random thing we found interesting.
Those conversations are lovely, and I genuinely enjoy them. But I also hope we get to a point where we can talk about things that require a little more openness.
Our feelings, for instance.
The things that bother us but we rarely mention. The things we are afraid of. Our insecurities, expectations, personal struggles, and the experiences that have influenced how we see people and relationships.
I want us to have conversations where we don’t necessarily have to pretend everything is fine.
Conversations about our past, our present, and the kind of future we hope to have.
Conversations about things we might not ordinarily bring up with just anybody.
Even matured conversations. The kind that go beyond casual discussions and allow two people to understand each other’s minds, emotional experiences, boundaries, beliefs, and perspectives.
I want to know how you think when life becomes complicated. I want to know how you handle disappointment, how you process emotions, what you expect from people, and what genuine connection means to you.
And I want you to know those things about me, too.
I want to be able to tell you things about myself that I haven’t necessarily found the right opportunity to share.
I want to tell you about my experiences, the things I have been through, the things I am still figuring out, the thoughts I sometimes struggle to put into words, and even the little details about myself that might never come up in ordinary conversations.
I want us to discover each other gradually.
I don’t want us to feel like we have to rush through everything. There is something lovely about knowing that even after months of talking, there are still things to discover about someone.
Perhaps one day, we will find ourselves discussing something and realise that we have opened an entirely new part of each other’s lives.
And I hope we never lose that curiosity.
Because I don’t just want to know what you like. I want to understand why you like it.
I don’t just want to know what you believe. I want to understand the experiences and thoughts that brought you to those beliefs.
I don’t just want to hear about what happened during your day. I want to understand how those experiences made you feel.
I think there is a difference between knowing someone’s details and actually knowing someone.
And I would love for us to experience the latter.
I hope you never feel that you have to present a perfect version of yourself around me. You can be happy, confused, excited, frustrated, emotional, uncertain, or even completely unreasonable sometimes. We are human, after all.
I don’t expect you to have the right words for everything.
Sometimes, I hope we can simply talk.
And sometimes, perhaps, we won’t even need to solve anything. We will just listen and understand.
I think that is one of the things I would love to experience with you: a friendship where we can be comfortable enough to discuss almost anything without constantly wondering how the other person will interpret it.
And Eni, I hope you understand that I don’t say all this because I think you owe me a deeper connection.
You don’t.
I am simply expressing something I would genuinely love for us to build.
I appreciate you, and I would love to keep discovering the person you are.
There is something almost romantic about the idea of two people gradually becoming familiar with each other’s worlds, not necessarily through romance, but through genuine affection, curiosity, trust, and understanding.
The kind of connection where you begin to recognise the little things about someone.
Where you know what makes them happy, what makes them quiet, what excites them, and what they sometimes struggle to say.
Where you don’t just communicate because you have something to discuss, but because you genuinely enjoy the presence of the other person.
And I think that is something worth experiencing.
I don’t know how much of that we will discover over time, but I hope we give ourselves the opportunity.
I hope there are many more conversations ahead of us.
I hope there are nights when we start discussing something ordinary and somehow end up talking about our deepest thoughts.
I hope there are moments when one of us says something unexpected and the other spends the next few minutes trying to understand it.
I hope we can talk about things we agree on, things we disagree on, things that make us laugh, and things that make us reflect.
I hope we never become too familiar to stop being curious about each other.
And most importantly, I hope we can both be ourselves.
I also want to tell you something about the future.
As you begin another chapter of your life, particularly with university approaching, I hope you experience everything you have been looking forward to.
I hope you meet wonderful people, build meaningful friendships, discover new interests, and create memories that you will carry for years.
I hope you become more confident, more knowledgeable, and more comfortable with the person you are becoming.
I hope you find people who challenge your thinking and encourage your growth.
And I hope you never feel guilty for growing, changing, or experiencing new things.
I know life will introduce new routines. There will be days when you are occupied, days when you have too much going on, and days when conversations might have to wait.
That’s life.
But I hope that somewhere in all those experiences, we continue making room for each other.
I would love to hear about your university experiences. The exciting ones, the annoying ones, the unexpected ones, and even the ordinary ones that you might not think are worth mentioning.
I want to hear about the people you meet, the things you learn, and the experiences that shape you.
And I hope you remain interested in the things happening in my own little world, too.
I want us to have so much more to tell each other as time goes on.
I don’t want our friendship to be limited to the circumstances in which we met. I want it to grow alongside the different lives we are both living.
And perhaps, someday, we will finally get to meet.
I would genuinely love that.
To finally sit somewhere together, have conversations without a screen between us, laugh about things we once discussed online, and create memories that aren’t limited to messages and call histories.
I hope that happens.
But until then, I hope we continue building something worth remembering.
I know I can sometimes be extra with my expressions, and perhaps I attach a little more meaning to certain things than people ordinarily would.
But I hope you never misunderstand that.
I am not trying to make you responsible for my happiness, nor am I expecting you to give me the same amount of attention I give you.
I simply have a genuine appreciation for you.
And sometimes, I think people should be told when their presence is valued.
You should know that you are appreciated.
Not only when you have something interesting to say, not only when you are available, and not only when we are having particularly good conversations.
Even in your ordinary moments.
Even when you have nothing to say.
Even when you are busy living your life.
I appreciate you as a person.
And I hope you never feel that you have to constantly do something to deserve that appreciation.
I want you to enjoy this friendship, too.
I want it to feel natural, comfortable, and mutual.
I want us to have the freedom to communicate, to be honest, to grow, and to understand each other without turning every little change into something to worry about.
And I hope that as we continue, we discover even more reasons to appreciate what we have.
There is a sentence I particularly love:
>“For a moment, you cherished me; I shall remember that for a lifetime.”
I think there is something beautiful about it.
Not because I want our friendship to be temporary, but because it reminds me that moments can carry a meaning far greater than their duration.
Sometimes, a simple conversation can become a treasured memory.
Sometimes, an ordinary interaction can remind someone that they are not as alone as they thought.
And sometimes, a person can make a difference without even knowing the extent of it.
I hope you understand that you have given me moments I genuinely cherish.
And I hope we create many more.
But today, I don’t want this letter to be about my loneliness, my fears, or the possibility of losing a friendship.
Today is about you.
Your life.
Your happiness.
Your dreams.
Your growth.
Your birthday.
I hope you have a year that surprises you in the most beautiful ways.
I hope the things you have been praying for begin finding their way into your life.
I hope you experience genuine happiness, not the kind that exists only when everything is going perfectly, but the kind that gives you peace even when life becomes difficult.
I hope you find reasons to be proud of yourself.
I hope you never settle for less than the respect and kindness you deserve.
I hope you always have people around you who genuinely want to see you do well.
And when you look back at this particular year, I hope you can say that you grew, learnt, experienced, and lived.
Eni, thank you for being someone I have had the opportunity to know.
Thank you for allowing me into little parts of your world.
Thank you for the conversations we have shared and for the person you have allowed me to discover so far.
I look forward to discovering more.
I look forward to knowing the things I don’t know yet.
I look forward to telling you things about myself that you haven’t heard.
I look forward to the conversations we haven’t had, the questions we haven’t asked, the disagreements we haven’t encountered, and the memories we haven’t created.
There is still so much ahead of us, and I hope we get to experience a good portion of it together.
And if there is one thing I want you to take away from this letter, it is that you don’t have to be someone extraordinary every single day to be appreciated.
Sometimes, simply being yourself is enough.
So, on your birthday, I hope you allow yourself to feel celebrated.
I hope you smile.
I hope you feel loved.
I hope you recognise how far you have come and how much more life still has to offer you.
And I hope you never forget that your existence is something worth celebrating.
Happy birthday, Eni.
May this new chapter be kinder, brighter, fuller, and more beautiful than the one before it.
May you find happiness in unexpected places.
May you never lack reasons to smile.
May you have the courage to pursue the life you want.
And may you always have people around you who appreciate you for who you truly are.
I am glad I met you.
I am glad we became friends.
And I am genuinely looking forward to knowing you even more.
Here’s to you, Eni. To the person you are, the person you are becoming, and all the beautiful things still waiting to happen in your life.
Happy birthday. ❤️
And one last thing: I hope that long after today has passed, you can still return to these words and feel appreciated all over again. Because you deserve to be celebrated on ordinary days, too.
>With genuine affection,
>Your friend.`;
const txt=document.getElementById('txt');
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{root:document.getElementById('letter'),threshold:.15});
T.split('\n').forEach(l=>{const p=document.createElement('p');if(l[0]=='~'){p.className='sub';l=l.slice(1)}else if(l[0]=='>'){p.className=l.includes('cherished')?'q':'s';l=l.slice(1)}p.textContent=l;txt.appendChild(p);io.observe(p)});
const end=document.createElement('button');end.className='btn show party';end.textContent='Celebrate 🎉';end.onclick=()=>confetti();txt.appendChild(end);

/* sky */
const cv=document.getElementById('c'),x=cv.getContext('2d');let W,H,stars=[],sh=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;stars=Array.from({length:110},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,p:Math.random()*6}))}
rs();addEventListener('resize',rs);
function shoot(){sh.push({x:Math.random()*W*.9+W*.1,y:Math.random()*H*.4,v:9+Math.random()*6,l:0})}
let burst=false,t=0,pc=[];
function confetti(){const c=['#f3b8c8','#f6d68a','#fff','#ff9fb5','#b9a6ff'];for(let i=0;i<140;i++)pc.push({x:W/2,y:H*.6,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,r:Math.random()*5+3,c:c[i%5],a:1,h:Math.random()<.25})}
(function loop(){t+=.03;x.clearRect(0,0,W,H);
stars.forEach(s=>{x.globalAlpha=.4+.6*Math.abs(Math.sin(t+s.p));x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()});
x.globalAlpha=1;
if(Math.random()<(burst?.12:.008))shoot();
sh=sh.filter(s=>s.l<70);sh.forEach(s=>{s.x-=s.v;s.y+=s.v*.6;s.l++;const g=x.createLinearGradient(s.x,s.y,s.x+90,s.y-54);g.addColorStop(0,'#fff');g.addColorStop(1,'#fff0');x.strokeStyle=g;x.lineWidth=2;x.beginPath();x.moveTo(s.x,s.y);x.lineTo(s.x+90,s.y-54);x.stroke()});
pc=pc.filter(p=>p.a>0);pc.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.vx*=.99;p.a-=.006;x.globalAlpha=Math.max(p.a,0);x.fillStyle=p.c;if(p.h){x.font=p.r*3+'px serif';x.fillText('♥',p.x,p.y)}else x.fillRect(p.x,p.y,p.r,p.r*1.6)});x.globalAlpha=1;
requestAnimationFrame(loop)})();

/* flow */
const s1=document.getElementById('s1'),s2=document.getElementById('s2'),env=document.getElementById('env'),hb=document.getElementById('hb'),btn=document.getElementById('read'),L=document.getElementById('letter');
env.onclick=()=>{
  env.classList.add('open');burst=true;
  setTimeout(()=>{s1.classList.add('hidden');s2.classList.remove('hidden');
    'Happy Birthday,|Eni ✨'.split('|').forEach((w,i,a)=>{
      [...w].forEach((ch,j)=>{const s=document.createElement('span');s.textContent=ch==' '?'\u00a0':ch;s.style.animationDelay=(i*1.1+j*.08)+'s';hb.appendChild(s)});
      if(i<a.length-1)hb.appendChild(document.createElement('br'));
    });
    confetti();setTimeout(confetti,1800);setTimeout(()=>btn.classList.add('show'),3000);
  },1700);
};
btn.onclick=()=>{s2.classList.add('hidden');L.classList.add('show');burst=false;L.scrollTop=0;confetti()};
L.onscroll=()=>{document.getElementById('bar').style.width=(L.scrollTop/(L.scrollHeight-L.clientHeight)*100)+'%'};
</script>
</body>
</html>
